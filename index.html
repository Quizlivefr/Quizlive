<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>QuizLive — Prototype</title>
<style>
*{box-sizing:border-box} body{margin:0;background:#100b19;color:#fff;font-family:Arial,Helvetica,sans-serif;overflow:hidden}
.app{width:100vw;height:100vh;padding:22px;background:radial-gradient(circle at 50% 0,#43225f 0,#1b1027 42%,#0d0911 100%)}
.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}
.badge{background:#6b35a0;padding:8px 14px;border-radius:18px;font-weight:700}.round{color:#fff;background:#e94566;padding:8px 16px;border-radius:18px;font-weight:800}
.progress{height:8px;background:#4d3658;border-radius:10px;overflow:hidden;margin-bottom:18px}.bar{height:100%;width:42%;background:#ef526f}
.meta{display:flex;gap:10px;justify-content:center;margin-bottom:12px}.pill{padding:7px 14px;border-radius:18px;background:#713e8f;font-weight:700}.pill.gold{background:#805d35}
.question{background:#fff;color:#18131c;border-radius:18px;padding:22px;text-align:center;font-size:clamp(20px,3vw,38px);font-weight:800;min-height:90px;display:flex;align-items:center;justify-content:center;margin-bottom:18px}
.answers{display:grid;grid-template-columns:1fr 1fr;gap:18px;height:58vh}
.answer{border:0;border-radius:18px;color:#fff;position:relative;overflow:hidden;padding:24px;display:flex;align-items:center;justify-content:center;font-size:clamp(18px,2.4vw,32px);font-weight:900;text-shadow:0 2px 4px #0005;box-shadow:0 8px 22px #0005;cursor:pointer}
.a{background:#ef4141}.b{background:#3f8fe8}.c{background:#efa62e}.d{background:#31ad62}
.letter{position:absolute;inset:auto 50% 8px auto;transform:translateX(50%);font-size:95px;opacity:.12}.count{position:absolute;top:12px;right:16px;background:#ffffff33;border-radius:20px;padding:5px 10px;font-size:16px}
.avatar{position:absolute;width:38px;height:38px;border-radius:50%;border:3px solid #fff;object-fit:cover;box-shadow:0 2px 8px #0008}
.footer{position:absolute;left:0;right:0;bottom:12px;text-align:center;font-weight:700;color:#d7c9df}
#leader{position:fixed;right:18px;bottom:50px;background:#17101fdd;padding:12px 16px;border-radius:14px;min-width:210px;display:none}
#leader div{padding:5px 0}
</style>
</head>
<body>
<div class="app">
  <div class="top"><div class="badge">🎮 QUIZLIVE</div><div class="round" id="round">Manche 1/30</div></div>
  <div class="progress"><div class="bar" id="bar"></div></div>
  <div class="meta"><div class="pill" id="cat">Culture générale</div><div class="pill gold">Moyen</div><div class="pill">⏱ <span id="time">10</span>s</div></div>
  <div class="question" id="question">Chargement…</div>
  <div class="answers">
    <button class="answer a" onclick="choose(0)"> <span id="o0"></span><span class="letter">A</span><span class="count">A</span></button>
    <button class="answer b" onclick="choose(1)"> <span id="o1"></span><span class="letter">B</span><span class="count">B</span></button>
    <button class="answer c" onclick="choose(2)"> <span id="o2"></span><span class="letter">C</span><span class="count">C</span></button>
    <button class="answer d" onclick="choose(3)"> <span id="o3"></span><span class="letter">D</span><span class="count">D</span></button>
  </div>
  <div class="footer">Réponds vite : les points diminuent avec le temps</div>
</div>
<div id="leader"></div>
<script>
const quiz=[
["Quelle est la capitale de l'Australie?",["Sydney","Canberra","Melbourne","Perth"],1,"Géographie"],
["Quel est le plus grand océan?",["Atlantique","Indien","Pacifique","Arctique"],2,"Géographie"],
["Combien y a-t-il de côtés sur un hexagone?",["5","6","7","8"],1,"Culture générale"],
["Quel jeu vidéo met en scène Link?",["Minecraft","Zelda","Fortnite","Halo"],1,"Jeux vidéo"],
["Quelle planète est surnommée la planète rouge?",["Mars","Vénus","Jupiter","Mercure"],0,"Sciences"],
["Quel animal est le plus grand mammifère?",["Éléphant","Girafe","Baleine bleue","Orque"],2,"Sciences"],
["Combien font 12 × 8?",["86","96","108","112"],1,"Calcul"],
["Dans quel pays se trouve Tokyo?",["Chine","Corée du Sud","Japon","Thaïlande"],2,"Géographie"],
["Quel est le symbole chimique de l'or?",["Ag","Au","Fe","O"],1,"Sciences"],
["Quel sport se joue avec un volant?",["Tennis","Badminton","Rugby","Handball"],1,"Sport"]
];
// 20 questions supplémentaires générées avec le même format simple
quiz.push(
["Quel est le plus grand continent?",["Afrique","Europe","Asie","Océanie"],2,"Géographie"],
["Combien de jours compte une année bissextile?",["364","365","366","367"],2,"Culture générale"],
["Quel personnage utilise une Master Sword?",["Link","Mario","Sonic","Kratos"],0,"Jeux vidéo"],
["Quelle langue est principalement parlée au Brésil?",["Espagnol","Portugais","Italien","Anglais"],1,"Culture générale"],
["Combien de minutes dans 2 heures?",["100","110","120","140"],2,"Calcul"],
["Quelle est la monnaie du Japon?",["Won","Yuan","Yen","Dollar"],2,"Culture générale"],
["Quelle console est fabriquée par Nintendo?",["PlayStation","Xbox","Switch","Steam Deck"],2,"Jeux vidéo"],
["Quel gaz les humains respirent-ils principalement pour vivre?",["Oxygène","Hélium","Néon","Hydrogène"],0,"Sciences"],
["Quel est le résultat de 15 + 27?",["32","40","42","44"],2,"Calcul"],
["Quelle ville est la capitale de la France?",["Lyon","Marseille","Paris","Lille"],2,"Géographie"],
["Quel animal est connu pour sa trompe?",["Lion","Éléphant","Tigre","Loup"],1,"Culture générale"],
["Quel jeu est un battle royale?",["Tetris","Fortnite","FIFA","Minecraft Story Mode"],1,"Jeux vidéo"],
["Combien de lettres dans l'alphabet français?",["24","25","26","27"],2,"Culture générale"],
["Quelle planète est la plus proche du Soleil?",["Mars","Mercure","Terre","Neptune"],1,"Sciences"],
["Combien font 100 ÷ 4?",["20","25","30","40"],1,"Calcul"],
["Quel sport utilise un panier?",["Basketball","Football","Tennis","Natation"],0,"Sport"],
["Quel pays a pour capitale Madrid?",["Portugal","Espagne","Italie","Grèce"],1,"Géographie"],
["Quel jeu est associé à Pikachu?",["Pokémon","Halo","FIFA","Fortnite"],0,"Jeux vidéo"],
["Quel métal est liquide à température ambiante?",["Fer","Cuivre","Mercure","Aluminium"],2,"Sciences"],
["Combien font 9 × 9?",["72","81","90","99"],1,"Calcul"]
);
let i=0, time=10, timer=null, scores={"Joueur_1":0,"Joueur_2":0,"Joueur_3":0};
function render(){
 const q=quiz[i%quiz.length]; document.getElementById("round").textContent=`Manche ${i+1}/30`;
 document.getElementById("question").textContent=q[0]; document.getElementById("cat").textContent=q[3];
 q[1].forEach((x,n)=>document.getElementById("o"+n).textContent=x);
 document.getElementById("bar").style.width=((i+1)/30*100)+"%";
 time=10; document.getElementById("time").textContent=time;
 clearInterval(timer); timer=setInterval(()=>{time--;document.getElementById("time").textContent=time;if(time<=0){clearInterval(timer);next()}},1000);
}
function choose(n){
 const correct=quiz[i%quiz.length][2];
 if(n===correct) alert("Bonne réponse ! Dans la version LIVE, le serveur attribuera automatiquement les points selon la vitesse.");
 else alert("Mauvaise réponse !");
 next();
}
function next(){clearInterval(timer); if(i<29){i++;render()}else{document.getElementById("question").textContent="🏆 FIN DU QUIZ — CLASSEMENT";document.querySelector(".answers").style.display="none";document.querySelector(".footer").textContent="Prototype terminé";}}
render();
</script>
</body></html>
